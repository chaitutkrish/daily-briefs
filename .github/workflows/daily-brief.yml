name: Daily Content Briefs

on:
  schedule:
    # 6 AM EST = 11:00 UTC (accounts for EST = UTC-5)
    - cron: "0 11 * * *"
  workflow_dispatch:
    # Also allows manual trigger from GitHub UI anytime

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # needed to commit output files back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic requests beautifulsoup4

      - name: Generate daily briefs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_briefs.py

      - name: Commit and push output files
        run: |
          git config user.name  "Daily Brief Bot"
          git config user.email "bot@daily-briefs"
          git add output/
          git diff --cached --quiet || git commit -m "Daily briefs — $(date +'%Y-%m-%d')"
          git push
